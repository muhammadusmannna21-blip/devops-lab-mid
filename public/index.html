<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Submission Portal</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; background: #f4f6f9; color: #222; }
    .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; }
    h1 { margin-top: 0; color: #1a365d; }
    .badge { display: inline-block; font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #e2e8f0; margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-top: 12px; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
    button:hover { background: #1d4ed8; }
    .msg { margin-top: 14px; padding: 10px; border-radius: 5px; display: none; }
    .error { background: #fee2e2; color: #991b1b; display: block; }
    .success { background: #dcfce7; color: #166534; display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Assignment Submission Portal</h1>
    <span id="modeBadge" class="badge">Checking backend...</span>

    <form id="submissionForm" novalidate>
      <label for="name">Student Name *</label>
      <input type="text" id="name" placeholder="e.g. Ali Raza" required />

      <label for="regNo">Registration Number *</label>
      <input type="text" id="regNo" placeholder="e.g. FA22-BCS-045" required />

      <label for="title">Assignment Title *</label>
      <input type="text" id="title" placeholder="e.g. DevOps Lab Mid" required />

      <label for="url">Submission URL (GitHub / Drive Link) *</label>
      <input type="url" id="url" placeholder="https://github.com/username/repo" required />

      <button type="submit">Submit Assignment</button>
    </form>
    <div id="feedback" class="msg"></div>
  </div>

  <div class="card">
    <h2>Saved Submissions</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Reg No</th>
          <th>Assignment</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="submissionList">
        <tr><td colspan="4">No submissions yet.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let useStaticFallback = false;

    function isValidUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function showMessage(text, type) {
      const box = document.getElementById('feedback');
      box.textContent = text;
      box.className = 'msg ' + type;
    }

    function renderList(items) {
      const tbody = document.getElementById('submissionList');
      if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">No submissions yet.</td></tr>';
        return;
      }
      tbody.innerHTML = items.map(item => `
        <tr>
          <td>${item.name}</td>
          <td>${item.regNo}</td>
          <td>${item.title}</td>
          <td><a href="${item.url}" target="_blank" rel="noopener">View Submission</a></td>
        </tr>
      `).join('');
    }

    async function loadSubmissions() {
      const badge = document.getElementById('modeBadge');
      try {
        const res = await fetch('/api/submissions');
        if (!res.ok) throw new Error('API unavailable');
        const data = await res.json();
        useStaticFallback = false;
        badge.textContent = 'Mode: Node.js Backend API';
        renderList(data);
      } catch {
        useStaticFallback = true;
        badge.textContent = 'Mode: GitHub Pages Static Demo (LocalStorage)';
        const localData = JSON.parse(localStorage.getItem('submissions') || '[]');
        renderList(localData);
      }
    }

    document.getElementById('submissionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value.trim(),
        regNo: document.getElementById('regNo').value.trim(),
        title: document.getElementById('title').value.trim(),
        url: document.getElementById('url').value.trim()
      };

      if (!useStaticFallback) {
        const res = await fetch('/api/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          showMessage(data.error || 'Submission failed.', 'error');
          return;
        }
        showMessage('Assignment submitted successfully!', 'success');
        e.target.reset();
        loadSubmissions();
      } else {
        if (!payload.name) return showMessage('Student name is required.', 'error');
        if (!payload.regNo) return showMessage('Registration number is required.', 'error');
        if (!payload.title) return showMessage('Assignment title is required.', 'error');
        if (!payload.url || !isValidUrl(payload.url)) return showMessage('A valid HTTP/HTTPS submission URL is required.', 'error');

        const localData = JSON.parse(localStorage.getItem('submissions') || '[]');
        localData.push(payload);
        localStorage.setItem('submissions', JSON.stringify(localData));
        showMessage('Assignment saved in static demo mode!', 'success');
        e.target.reset();
        loadSubmissions();
      }
    });

    loadSubmissions();
  </script>
</body>
</html>
