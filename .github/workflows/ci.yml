name: DevOps Lab Mid CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-report-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Run Automated Tests
        id: run_tests
        run: npm test

      - name: 5. Send Report to Localhost Receiver (Pass & Fail)
        if: always()
        run: |
          curl -X POST "${{ secrets.RECEIVER_URL }}/report" \
            -H "Content-Type: application/json" \
            -H "ngrok-skip-browser-warning: true" \
            -d @test-report.json

      - name: 6. Upload Static Site for GitHub Pages (Bonus 1 - Only on Pass)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: 7. Deploy to GitHub Pages (Bonus 1 - Only on Pass)
        if: success() && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4